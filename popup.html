<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reverse Vertical Tab Placement</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Selected tabs</h1>
      <div class="actions">
        <button id="move-selected-tabs" type="button">Move selected tabs to top</button>
        <button id="copy-selected-tab-urls" type="button">Copy selected tab URLs</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="open-options" class="options-link" type="button">Extension options</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
