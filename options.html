<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reverse Vertical Tab Placement Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>Reverse Vertical Tab Placement</h1>

      <section aria-labelledby="selected-tabs-heading">
        <h2 id="selected-tabs-heading">Selected tabs</h2>
        <p class="description">Run an action on the highlighted tabs in this window.</p>
        <div class="actions">
          <button id="move-selected-tabs" type="button">Move selected tabs to top</button>
          <button id="copy-selected-tab-urls" class="secondary" type="button">Copy selected tab URLs</button>
        </div>
        <p id="tab-action-status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="gemini-heading">
        <h2 id="gemini-heading">Gemini Nano</h2>
        <p class="description">Check or prepare the local model used to name automatic tab groups.</p>
        <div class="actions">
          <button id="prepare-model" type="button">Prepare local model</button>
          <button id="check-status" class="secondary" type="button">Check status</button>
        </div>
        <p id="model-status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
